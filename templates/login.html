<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.css') }}">
    <title>{{ titulo }}</title>
    
    <style>
        .bg-blue-gradient {
            background: linear-gradient(135deg, #003366 0%, #0056b3 100%);
            color: #ffffff;
        }
        
        .btn-gradient {
            background: linear-gradient(135deg, #004080 0%, #0069d9 100%);
            color: white;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-gradient:hover, .btn-gradient:focus {
            background: linear-gradient(135deg, #00264d 0%, #004b99 100%);
            color: white;
            box-shadow: 0 0 0 0.25rem rgba(0, 86, 179, 0.5);
        }
    </style>
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-blue-gradient shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">SuperShop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Início</a></li>
                    <!-- <li class="nav-item"><a class="nav-link" href="{{ url_for('favoritos') }}">Favoritos</a></li> -->
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="{{ url_for('usuario') }}">Usuário</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('produtos') }}">Produtos</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('categoria') }}">Categorias</a></li>
                    <!-- <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Relatórios
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="{{ url_for('relatorioVendas') }}">Vendas</a></li>
                            <li><a class="dropdown-item" href="{{ url_for('relatorioCompras') }}">Compras</a></li>
                        </ul>
                    </li> -->
                    {% if current_user.is_authenticated %}
                        <li class="nav-item"><a class="nav-link text-warning" href="{{ url_for('logout') }}">Sair</a></li>
                    {% else %}
                        <li class="nav-item"><a class="nav-link text-info" href="{{ url_for('login') }}">Entrar</a></li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <header class="text-center mb-4">
                    <h1 class="display-5 fw-bold text-dark">{{ titulo }}</h1>
                </header>

                {% if error %}
                <div class="alert alert-danger shadow-sm text-center fw-medium" role="alert">
                    {{ error }}
                </div>
                {% endif %}

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-blue-gradient text-white text-center py-3">
                        <h5 class="card-title mb-0">Acesse sua conta</h5>
                    </div>
                    <div class="card-body p-4">
                        <form action="/login" method="post">
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Email</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Senha</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <button type="submit" class="btn btn-gradient w-100 py-2 fw-bold">Entrar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
