<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.css') }}">
    <title>{{ titulo }}</title>
    
    <style>
        .bg-blue-gradient {
            background: linear-gradient(135deg, #003366 0%, #0056b3 100%);
            color: #ffffff;
        }
        
        .btn-gradient {
            background: linear-gradient(135deg, #004080 0%, #0069d9 100%);
            color: white;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-gradient:hover, .btn-gradient:focus {
            background: linear-gradient(135deg, #00264d 0%, #004b99 100%);
            color: white;
            box-shadow: 0 0 0 0.25rem rgba(0, 86, 179, 0.5);
        }
    </style>
</head>

<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-blue-gradient shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">SuperShop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}">Início</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5 text-center">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 mt-4">
                    <div class="card-body p-5">
                        <h1 class="display-1 fw-bold text-danger mb-3">404</h1>
                        <h2 class="h3 fw-bold text-dark mb-4">{{ titulo }}</h2>
                        <p class="lead text-muted mb-2">Opa, não tem nada para ver aqui...</p>
                        <p class="text-secondary mb-5">Verifique sua conexão com a internet e tente novamente mais tarde.</p>
                        <a href="{{ url_for('index') }}" class="btn btn-gradient px-5 py-2 fw-bold">Voltar para o Início</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
